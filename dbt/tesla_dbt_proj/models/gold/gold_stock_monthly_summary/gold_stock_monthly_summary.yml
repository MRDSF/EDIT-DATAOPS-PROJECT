version: 2

models:
  - name: gold_stock_monthly_summary
    description: "Monthly aggregated Tesla stock metrics"
    columns:
      - name: month
        description: "First day of the month"
        tests:
          - unique
          - not_null
      - name: month_low
        description: "Lowest price during the month"
      - name: month_high
        description: "Highest price during the month"
      - name: avg_close_price
        description: "Average closing price for the month"
      - name: total_volume
        description: "Total trading volume for the month"
      - name: total_dividends
        description: "Total dividend amount for the month"
      - name: trading_days
        description: "Number of trading days in the month"
